name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write   # lets the test reporter publish results to the PR

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # verify = compile + tests + packaging + Checkstyle (warnings only)
      - name: Build and test
        run: mvn -B verify

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: JUnit results
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit
